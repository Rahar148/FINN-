<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINN — Demo workspace</title><style>
:root{--bg:#0b0c0f;--side:#101115;--panel:#15171c;--panel2:#1a1d23;--line:#292c33;--text:#f2f0e9;--muted:#92949a;--lime:#d8ff63;--red:#ff806f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,system-ui,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column}.logo{display:flex;gap:11px;align-items:center;padding:0 8px 28px;font-weight:800;letter-spacing:.18em}.mark{width:30px;height:30px;background:var(--lime);color:#111;border-radius:4px;display:grid;place-items:center;letter-spacing:0;font-weight:900}.nav{display:grid;gap:4px}.nav button,.settings{border:0;background:transparent;color:#8d8f94;padding:11px 12px;border-radius:7px;text-align:left;font-size:14px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active,.settings:hover{background:#1a1c21;color:var(--text)}.nav button.active{box-shadow:inset 2px 0 var(--lime)}.sidefoot{margin-top:auto}.workspace{border:1px solid var(--line);border-radius:9px;padding:11px;background:#15171b}.workspace b{display:block;font-size:12px}.workspace small{color:#d7aa5a;font-size:10px}.settings{width:100%;margin-top:8px}.main{max-width:1120px;width:100%;margin:auto;padding:42px 48px 80px}.header{display:flex;justify-content:space-between;align-items:end;padding-bottom:23px;border-bottom:1px solid #24262b}.eyebrow{font-size:10px;letter-spacing:.18em;color:#7d7f84;font-weight:700}.header h1{font-size:30px;letter-spacing:-.04em;margin:6px 0 0}.actions{display:flex;gap:8px}.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:700}.primary{background:var(--lime);color:#111}.secondary{background:#1b1d22;color:#ddd;border:1px solid #303238}.intro{display:flex;justify-content:space-between;padding:21px 2px 15px;color:var(--muted);font-size:13px}.grid{columns:2;column-gap:14px}.card{break-inside:avoid;display:inline-block;width:100%;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.card:hover{border-color:#44474f}.cardtop,.author,.tools,.footer{display:flex;align-items:center}.cardtop,.footer{justify-content:space-between}.author{gap:9px}.avatar{width:30px;height:30px;border-radius:50%;background:#34373d;display:grid;place-items:center;font-size:10px;font-weight:700}.author b{display:block;font-size:12px}.author small{font-size:10px;color:#81848a}.tools button{border:0;background:transparent;color:#858890;font-size:18px;padding:5px}.tools button.on{color:var(--lime)}.kind{margin-top:17px;color:var(--lime);font-size:9px;letter-spacing:.14em;font-weight:800}.card h3{font-size:17px;margin:8px 0}.card blockquote{font-family:Georgia,serif;border-left:2px solid var(--lime);padding-left:12px;margin:12px 0;color:#d6d3cc;line-height:1.5;font-size:14px}.card p{font-size:12px;color:#aaa;line-height:1.55}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:13px 0}.tags span{font-size:9px;background:#202228;border:1px solid #30333a;padding:4px 7px;border-radius:4px;color:#aaa}.footer{border-top:1px solid #282a30;padding-top:11px;margin-top:12px;color:#83858b;font-size:10px}.footer button{border:0;background:transparent;color:#aaa}.capture{max-width:620px;margin:18px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:27px}.capture h2{margin:5px 0}.capture>p{color:var(--muted);font-size:13px}.capture label{font-size:11px;color:#aaa;font-weight:600;display:grid;gap:7px;margin:13px 0}.capture input,.capture textarea,.capture select,.searchbox input{background:#0d0e11;color:#eee;border:1px solid #33363e;border-radius:7px;padding:11px;outline:0}.capture textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 155px;gap:10px}.submit{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.privacy{display:block;text-align:right;color:#777;font-size:9px;margin-top:9px}.overlay{position:fixed;inset:0;background:#050506dc;z-index:10;padding:11vh 20px}.searchbox{max-width:630px;margin:auto;background:#15171c;border:1px solid #3a3d44;border-radius:10px;padding:14px}.searchbox input{width:100%;font-size:15px}.results{margin-top:8px}.result{width:100%;border:0;border-top:1px solid #282a2f;background:transparent;color:white;text-align:left;padding:12px}.result small{display:block;color:#888;margin-top:4px}.notice{border:1px solid #4c4229;background:#211d13;color:#d9bd78;border-radius:7px;padding:11px 13px;font-size:11px;margin:17px 0}.empty{text-align:center;color:#888;padding:75px}.toast{position:fixed;right:22px;bottom:22px;background:var(--lime);color:#111;font-weight:700;padding:12px 16px;border-radius:7px;z-index:20;box-shadow:0 12px 35px #0008}.about{max-width:700px;margin:60px auto;text-align:center}.about .big{font-size:70px;line-height:1;font-weight:900;letter-spacing:-.07em}.about p{color:#aaa;line-height:1.7}.hidden{display:none!important}@media(max-width:760px){.app{grid-template-columns:1fr}.side{height:auto;position:static;padding:16px}.logo{padding-bottom:12px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{justify-content:center}.sidefoot{display:none}.main{padding:24px 17px}.grid{columns:1}.header h1{font-size:25px}.actions .secondary{display:none}}@media(max-width:430px){.nav button{font-size:0}.nav button::first-letter{font-size:15px}.row{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo"><span class="mark">F</span>FINN</div><nav class="nav"><button data-view="feed" class="active">⌂ <span>Team feed</span></button><button data-view="pinned">◆ <span>Pinned</span></button><button data-view="capture">＋ <span>Capture</span></button><button id="searchBtn">⌕ <span>Search</span></button></nav><div class="sidefoot"><div class="workspace"><b>RahaR Team</b><small>● Demo workspace</small></div><button class="settings" data-view="about">⚙ About demo</button></div></aside><main class="main"><header class="header"><div><span class="eyebrow">RAHAR TEAM · DEMO</span><h1 id="heading">Team feed</h1></div><div class="actions"><button class="btn secondary" id="searchTop">Search</button><button class="btn primary" data-view="capture">+ Capture</button></div></header><div id="view"></div></main></div><div id="search" class="overlay hidden"><div class="searchbox"><input id="query" placeholder="Search clips, notes, tags…" autofocus><div id="results" class="results"></div><button class="btn secondary" id="closeSearch">Close</button></div></div><div id="toast" class="toast hidden"></div><script>
const seed=[{id:1,kind:'QUOTE',title:'A useful rule for clearer landing pages',content:'If everything is important, nothing is important. Give each screen one dominant action.',note:'Use this when we review the DUST 2 DOLLAR hero and dashboards.',url:'https://example.com/design-principles',source:'Design notes',tags:['design','hierarchy'],author:'Rahul',initials:'RA',age:'8m',pinned:true,privacy:'Team'},{id:2,kind:'PAGE',title:'Dashboard interaction patterns worth testing',content:'',note:'Strong examples for filters, bulk actions, empty states, and decision-support cards.',url:'https://21st.dev',source:'21st.dev',tags:['ui','dashboard','research'],author:'Anika',initials:'AK',age:'35m',pinned:false,privacy:'Team'},{id:3,kind:'NOTE',title:'Friday build review',content:'',note:'Check mobile navigation, loading states, error messages, and the final Render deployment checklist.',url:'',source:'Quick note',tags:['review','launch'],author:'You',initials:'YO',age:'1h',pinned:true,privacy:'Only me'},{id:4,kind:'LINK',title:'Better onboarding references',content:'',note:'Keep the first-run experience focused on one clear win before exposing advanced tools.',url:'https://www.notion.so',source:'Notion',tags:['onboarding','product'],author:'Vikram',initials:'VI',age:'2h',pinned:false,privacy:'Team'}];let clips=JSON.parse(localStorage.getItem('finn-demo-clips')||'null')||seed;let mode='feed';const el=id=>document.getElementById(id);function save(){localStorage.setItem('finn-demo-clips',JSON.stringify(clips))}function toast(t){el('toast').textContent=t;el('toast').classList.remove('hidden');setTimeout(()=>el('toast').classList.add('hidden'),1300)}function card(c){return `<article class="card"><div class="cardtop"><div class="author"><span class="avatar">${c.initials}</span><span><b>${c.author}</b><small>${c.age} ago · ${c.privacy}</small></span></div><div class="tools"><button class="pin ${c.pinned?'on':''}" data-id="${c.id}" title="Pin">◆</button></div></div><div class="kind">${c.kind} · FROM ${c.source.toUpperCase()}</div><h3>${c.title}</h3>${c.content?`<blockquote>“${c.content}”</blockquote>`:''}${c.note?`<p>${c.note}</p>`:''}<div class="tags">${c.tags.map(t=>`<span>#${t}</span>`).join('')}</div><footer class="footer"><span>${c.url?new URL(c.url).hostname:'FINN note'}</span><span><button class="copy" data-id="${c.id}">Copy</button>${c.url?` · <a href="${c.url}" target="_blank" style="color:#aaa">Open ↗</a>`:''}</span></footer></article>`}function feed(){const list=mode==='pinned'?clips.filter(x=>x.pinned):clips;el('view').innerHTML=`<div class="intro"><span>${mode==='pinned'?'Your important items, always close.':'Fresh finds and notes from your team.'}</span><span>${list.length} clips</span></div>${list.length?`<section class="grid">${list.map(card).join('')}</section>`:'<div class="empty">Nothing pinned yet.</div>'}`;bindCards()}function capture(){el('view').innerHTML=`<div class="notice">Demo mode: everything stays only in this browser. Nothing is shared with your team yet.</div><form class="capture" id="captureForm"><span class="eyebrow">QUICK CAPTURE</span><h2>Keep what matters.</h2><p>Save a page, passage, link, or thought with enough context for later.</p><label>Title<input name="title" required placeholder="What did you find?"></label><label>Note<textarea name="note" rows="4" placeholder="Why is this useful for the team?"></textarea></label><div class="row"><label>Tags<input name="tags" placeholder="design, research"></label><label>Visibility<select name="privacy"><option>Team</option><option>Only me</option></select></label></div><div class="submit"><button type="button" class="btn secondary" data-view="feed">Cancel</button><button class="btn primary">Add to FINN</button></div><small class="privacy">Demo data remains on this device.</small></form>`;el('captureForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);clips.unshift({id:Date.now(),kind:'NOTE',title:f.get('title'),content:'',note:f.get('note'),url:'',source:'Quick note',tags:String(f.get('tags')).split(',').map(x=>x.trim()).filter(Boolean),author:'You',initials:'YO',age:'now',pinned:false,privacy:f.get('privacy')});save();setMode('feed');toast('Saved to FINN demo')};bindNav()}function about(){el('view').innerHTML=`<section class="about"><div class="big">FINN</div><h2>Your team’s useful corner of the web.</h2><p>This review demo stores clips only in your current browser. It does not invite members, upload content, connect Supabase, or publish an extension.</p><p>After approval, FINN can become a private Chrome and Edge extension for RahaR’s ten members, protected by sign-in and database access rules.</p><button class="btn primary" data-view="capture">Try capture</button></section>`;bindNav()}function setMode(m){mode=m;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===m));el('heading').textContent=m==='feed'?'Team feed':m==='pinned'?'Pinned':m==='capture'?'Capture':'About FINN';m==='capture'?capture():m==='about'?about():feed()}function bindCards(){document.querySelectorAll('.pin').forEach(b=>b.onclick=()=>{const c=clips.find(x=>x.id==b.dataset.id);c.pinned=!c.pinned;save();feed();toast(c.pinned?'Pinned':'Unpinned')});document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{const c=clips.find(x=>x.id==b.dataset.id);navigator.clipboard?.writeText([c.title,c.content,c.note,c.url].filter(Boolean).join('\n\n'));toast('Copied')})}function bindNav(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setMode(b.dataset.view))}function openSearch(){el('search').classList.remove('hidden');el('query').focus();renderSearch('')}function renderSearch(q){const r=clips.filter(c=>JSON.stringify(c).toLowerCase().includes(q.toLowerCase()));el('results').innerHTML=r.map(c=>`<button class="result" data-id="${c.id}"><b>${c.title}</b><small>${c.author} · ${c.tags.map(t=>'#'+t).join(' ')}</small></button>`).join('')||'<div class="empty">No matches found.</div>';document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{const c=clips.find(x=>x.id==b.dataset.id);el('search').classList.add('hidden');toast('Found: '+c.title)})}bindNav();el('searchBtn').onclick=openSearch;el('searchTop').onclick=openSearch;el('closeSearch').onclick=()=>el('search').classList.add('hidden');el('query').oninput=e=>renderSearch(e.target.value);document.addEventListener('keydown',e=>{if(e.key==='Escape')el('search').classList.add('hidden');if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch()}});setMode('feed');
</script></body></html>
